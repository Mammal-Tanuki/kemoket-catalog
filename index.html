<header>

</main>
<script>const VERSION='2026-08-24-13';
const LS_EVENTS='kemoket_events_v1';
const LS_CURRENT_EVENT='kemoket_current_event_v1';
const OBSOLETE_TAG_KEYS=['kemoket_tag_defs_v2','kemoket_shared_tags_v1'];
const DEFAULT_EVENTS=[{id:'kemoket17',name:'けもケット17',sources:['https://skypalette.jp/kemoket/list.html']}];
const stateTemplate=()=>({color:'gray',item:'',budget:'',memo:'',visited:false,updatedAt:0});
const defaultPrefs=()=>({q:'',color:'all',sort:'space',detailDefaultOpen:false});
let circles=[];
let prefs=defaultPrefs();
let syncInfo=null;
let events=[];
let currentEventId='kemoket17';
let detailSessionOverrides=new Map();
let activeSourceUrl='';

function eventKey(kind){return `kemoket_event_${currentEventId}_${kind}_v1`;}
function uniq(a){return [...new Set((a||[]).filter(Boolean))];}
function normalizeEvent(ev){
  const e={...ev};
  let sources=Array.isArray(e.sources)?e.sources:[];
  if(!sources.length&&e.officialUrl)sources=[e.officialUrl];
  e.sources=uniq(sources.map(x=>String(x||'').trim()).filter(x=>/^https?:\/\//i.test(x)));

  return e;
}
function currentEvent(){return events.find(e=>e.id===currentEventId)||events[0];}
function getSources(){return currentEvent()?.sources||[];}
function getOfficialUrl(){return activeSourceUrl||getSources()[0]||'';}
function slugifyEvent(name){const base=String(name||'event').toLowerCase().normalize('NFKC').replace(/けもケット/g,'kemoket').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');return base||('event-'+Date.now());}
function saveEvents(){localStorage.setItem(LS_EVENTS,JSON.stringify(events));localStorage.setItem(LS_CURRENT_EVENT,currentEventId);}
function save(){localStorage.setItem(eventKey('circles'),JSON.stringify(circles));}
function savePrefs(){localStorage.setItem(eventKey('prefs'),JSON.stringify(prefs));}
function saveSync(){localStorage.setItem(eventKey('sync'),JSON.stringify(syncInfo));}
function normalizeState(st){const clean={...stateTemplate(),...(st||{})};delete clean.priority;delete clean.tags;delete clean.tagMeta;delete clean.tagCandidates;delete clean.detailsOpen;return clean;}
function normalizePrefs(raw){raw=raw&&typeof raw==='object'?raw:{};return {q:String(raw.q||''),color:['all','red','orange','yellow','green','blue','gray'].includes(raw.color)?raw.color:'all',sort:['space','name','unvisited'].includes(raw.sort)?raw.sort:'space',detailDefaultOpen:!!raw.detailDefaultOpen};}
function migrateCircle(c){
  const out={...c};
  out.space=normalizeSpace(out.space||'');out.name=cleanText(out.name||'');out.rep=cleanText(out.rep||'');
  out.attributes=uniq(Array.isArray(out.attributes)?out.attributes.map(cleanText):[]);
  out.links=normalizeLinks(out.links||[]);
  if(out.web)out.links=mergeLinks(out.links,[makeLink(out.web,'web')]);
  if(out.pixiv)out.links=mergeLinks(out.links,[makeLink(out.pixiv,'pixiv')]);
  if(out.tw||out.x)out.links=mergeLinks(out.links,[makeLink(out.tw||out.x,'x')]);
  out.linkCapabilities=uniq(Array.isArray(out.linkCapabilities)?out.linkCapabilities:((out.web!==undefined||out.pixiv!==undefined||out.tw!==undefined)?['web','pixiv','x']:[]));
  delete out.web;delete out.pixiv;delete out.tw;delete out.x;
  out.sourceUrls=uniq(Array.isArray(out.sourceUrls)?out.sourceUrls:[]);
  out.state=normalizeState(out.state);
  out.id=circleKey(out);
  return out;
}
function removeObsoleteStorage(){for(const key of OBSOLETE_TAG_KEYS)localStorage.removeItem(key);for(const ev of events){const ckey=`kemoket_event_${ev.id}_circles_v1`;try{const arr=JSON.parse(localStorage.getItem(ckey)||'[]');if(Array.isArray(arr))localStorage.setItem(ckey,JSON.stringify(arr.map(migrateCircle)));}catch(e){}const pkey=`kemoket_event_${ev.id}_prefs_v1`;try{localStorage.setItem(pkey,JSON.stringify(normalizePrefs(JSON.parse(localStorage.getItem(pkey)||'{}'))));}catch(e){}}}
function migrateK17(){if(currentEventId!=='kemoket17')return;const maps=[['kemoket17_circles_v2','circles'],['kemoket17_prefs_v2','prefs'],['kemoket17_sync_v1','sync']];for(const [oldKey,kind] of maps){const nk=eventKey(kind);if(!localStorage.getItem(nk)&&localStorage.getItem(oldKey))localStorage.setItem(nk,localStorage.getItem(oldKey));}}
function load(){
  try{events=JSON.parse(localStorage.getItem(LS_EVENTS)||'[]')}catch(e){events=[]}
  if(!Array.isArray(events)||!events.length)events=[...DEFAULT_EVENTS];events=events.map(normalizeEvent);if(!events[0].sources.length)events[0]=DEFAULT_EVENTS[0];
  currentEventId=localStorage.getItem(LS_CURRENT_EVENT)||events[0].id;if(!events.some(e=>e.id===currentEventId))currentEventId=events[0].id;
  migrateK17();removeObsoleteStorage();
  try{circles=JSON.parse(localStorage.getItem(eventKey('circles'))||'[]')}catch(e){circles=[]}
  if(!Array.isArray(circles))circles=[];circles=circles.map(migrateCircle);

function cleanText(s=''){return String(s).replace(/\*\*/g,'').replace(/<[^>]+>/g,'').replace(/&nbsp;/gi,' ').replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/\s+/g,' ').trim();}
function cleanMd(s=''){return cleanText(String(s).replace(/\[([^\]]+)\]\(([^)]+)\)/g,'$1').replace(/\\\|/g,'|'));}
function normalizeSpace(s=''){return cleanText(s).normalize('NFKC').replace(/\s+/g,'');}
function looksLikeSpace(s=''){
  const x=normalizeSpace(s);
  return /^(?:[A-Z]-?\d{1,3}(?:-[A-Z]?\d{1,3})?[ab]?|[ぁ-んァ-ヶ一-龯]\d{1,3}[ab]?|企\d{1,3})$/i.test(x);
}
function naturalParts(s=''){return normalizeSpace(s).normalize('NFKC').match(/\d+|\D+/g)||[''];}
function compareSpace(a,b){const x=naturalParts(a),y=naturalParts(b),n=Math.max(x.length,y.length);for(let i=0;i<n;i++){if(x[i]===undefined)return-1;if(y[i]===undefined)return 1;const xn=/^\d+$/.test(x[i]),yn=/^\d+$/.test(y[i]);if(xn&&yn){const d=Number(x[i])-Number(y[i]);if(d)return d;}else{const d=String(x[i]).localeCompare(String(y[i]),'ja',{numeric:true,sensitivity:'base'});if(d)return d;}}return 0;}
function circleKey(c){return `${normalizeSpace(c.space||'')}::${cleanText(c.name||'').normalize('NFKC').toLowerCase()}`;}
function isPlaceholderUrl(url=''){
  try{const base=getOfficialUrl();if(!base)return false;const a=new URL(url,base),b=new URL(base,location.href);const p=x=>(x||'/').replace(/\/+$/,'')||'/';return a.origin===b.origin&&p(a.pathname)===p(b.pathname)&&(a.hash===''||a.hash==='#');}catch(e){return false;}
}
function normalizeUrl(u=''){
  u=String(u||'').trim().replace(/^['"]|['"]$/g,'').replace(/&amp;/g,'&');
  if(!u||u==='#'||u==='-'||u==='—'||u==='–'||u==='　'||/^javascript:/i.test(u))return'';
  if(u.startsWith('//'))u='https:'+u;if(/^www\./i.test(u))u='https://'+u;if(!/^https?:\/\//i.test(u)&&/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u))u='https://'+u;
  try{const out=new URL(u,getOfficialUrl()||location.href).href;return /^https?:\/\//i.test(out)&&!isPlaceholderUrl(out)?out:'';}catch(e){return'';}
}
function classifyLink(url,labelHint=''){
  const hint=cleanText(labelHint).toLowerCase();let host='';try{host=new URL(url).hostname.toLowerCase()}catch(e){}
  if(/参加.?pr|pr投稿|event.?pr/.test(hint))return'pr';
  if(host==='x.com'||host.endsWith('.x.com')||host==='twitter.com'||host.endsWith('.twitter.com'))return'x';
  if(host==='pixiv.net'||host.endsWith('.pixiv.net'))return'pixiv';
  if(host==='instagram.com'||host.endsWith('.instagram.com'))return'instagram';
  if(host==='bsky.app'||host.endsWith('.bsky.app'))return'bsky';
  if(host==='booth.pm'||host.endsWith('.booth.pm'))return'booth';
  if(host==='youtube.com'||host.endsWith('.youtube.com')||host==='youtu.be')return'youtube';
  if(/pixiv/.test(hint))return'pixiv';if(/twitter|\bx\b/.test(hint))return'x';if(/web|hp|ホームページ|website/.test(hint))return'web';
  return'web';
}
function linkLabel(type){return ({pr:'参加PR',web:'web',x:'X',pixiv:'pixiv',instagram:'Instagram',bsky:'Bluesky',booth:'BOOTH',youtube:'YouTube',other:'link'})[type]||'link';}
function makeLink(url,labelHint=''){const u=normalizeUrl(url);if(!u)return null;const type=classifyLink(u,labelHint);return {type,label:linkLabel(type),url:u};}
function normalizeLinks(ls){return mergeLinks([],Array.isArray(ls)?ls.map(l=>{if(typeof l==='string')return makeLink(l);const u=normalizeUrl(l?.url||'');if(!u)return null;const type=l.type||classifyLink(u,l.label||'');return {type,label:l.label||linkLabel(type),url:u};}):[]);}
function mergeLinks(a,b){const out=[];const seen=new Set();for(const l of [...(a||[]),...(b||[])]){if(!l||!l.url)continue;const key=l.url.replace(/\/$/,'');if(seen.has(key))continue;seen.add(key);out.push(l);}return out;}
function extractLinks(text='',labelHint=''){
  const out=[];const src=String(text||'');
  for(const m of src.matchAll(/\[([^\]]*)\]\((https?:\/\/[^)\s]+)(?:\s+[^)]*)?\)/g)){const l=makeLink(m[2],labelHint||m[1]);if(l)out.push(l);}
  for(const m of src.matchAll(/https?:\/\/[^\s|>\]）)]+/gi)){const l=makeLink(m[0],labelHint);if(l)out.push(l);}
  return mergeLinks([],out);
}
function parseMeta(text=''){const src=String(text);const countMatch=src.match(/参加サークル\s*[：:]\s*([0-9０-９,，]+)\s*サークル/);const dateMatch=src.match(/\(?([0-9]{4}[\/年][0-9]{1,2}[\/月][0-9]{1,2})\s*(?:日)?\s*更新\)?/);const half=s=>String(s||'').normalize('NFKC').replace(/[,，]/g,'');return {expectedCount:countMatch?Number(half(countMatch[1])):null,officialUpdated:dateMatch?dateMatch[1].replace(/年|月/g,'/').replace(/日/g,''):''};}
function makeCircle({space='',name='',rep='',attributes=[],links=[],linkCapabilities=[],sourceUrl=''}){const c={space:normalizeSpace(space),name:cleanMd(name),rep:cleanMd(rep),attributes:uniq((attributes||[]).map(cleanMd).filter(Boolean)),links:normalizeLinks(links),linkCapabilities:uniq(linkCapabilities||[]),sourceUrls:sourceUrl?[sourceUrl]:[],state:stateTemplate()};if(!c.name||(!c.space&&c.name.length<2))return null;c.id=circleKey(c);return c;}
function splitOuterParen(text=''){
  const s=cleanMd(text).trim();if(!/[)）]$/.test(s))return {name:s,rep:''};let depth=0,start=-1;
  for(let i=s.length-1;i>=0;i--){const ch=s[i];if(ch===')'||ch==='）')depth++;else if(ch==='('||ch==='（'){depth--;if(depth===0){start=i;break;}}}
  if(start<1)return{name:s,rep:''};return{name:s.slice(0,start).trim(),rep:s.slice(start+1,-1).trim()};
}
function parsePipeLine(line){let x=line.trim().replace(/^L\d+\s*:\s*/,'');if(x.startsWith('|'))x=x.slice(1);if(x.endsWith('|'))x=x.slice(0,-1);return x.split('|').map(v=>v.trim());}
function headerIndex(headers,patterns){return headers.findIndex(h=>patterns.some(p=>p.test(cleanMd(h).toLowerCase())));}
function capabilityFromHeader(h=''){const s=cleanMd(h).toLowerCase();const hits=[];if(/pixiv/.test(s))hits.push('pixiv');if(/twitter|\btw\b|^x$/.test(s))hits.push('x');if(/web|^hp$|ホームページ/.test(s))hits.push('web');return hits.length===1?hits[0]:'';}
function parseGenericMarkdownTables(text,sourceUrl){

function parseTwoColumnMarkdown(text,sourceUrl){

function parseCardMarkdown(text,sourceUrl){

function parseMinimalLines(text,sourceUrl){

function parseHtmlTables(html,sourceUrl){

function parseEmbeddedJson(html,sourceUrl){

function extractCircleObjects(root,sourceUrl){const out=[];const seen=new WeakSet();function walk(v){if(!v||typeof v!=='object')return;if(seen.has(v))return;seen.add(v);if(Array.isArray(v)){v.forEach(walk);return;}const pick=(...keys)=>{for(const k of keys)if(typeof v[k]==='string'&&v[k].trim())return v[k];return'';};const space=pick('space','spaceNo','space_no','placement','booth','boothNo','booth_no','circleSpace');const name=pick('circleName','circle_name','circle','circleTitle','circle_title');if(space&&name&&looksLikeSpace(space)){let links=[];for(const [k,val] of Object.entries(v)){if(typeof val==='string'&&/^https?:\/\//.test(val)&&/url|link|web|twitter|pixiv|x/i.test(k)){const l=makeLink(val,k);if(l)links.push(l);}}const c=makeCircle({space,name,rep:pick('penName','pen_name','author','representative','pn'),attributes:[pick('genre','category','tendency')],links,sourceUrl});if(c)out.push(c);}Object.values(v).forEach(walk);}walk(root);return out;}

function unwrapPayload(text){const s=String(text||'').trim();if(s.startsWith('{')||s.startsWith('[')){try{const j=JSON.parse(s);for(const k of ['contents','body','content'])if(typeof j[k]==='string')return j[k];if(typeof j.data==='string')return j.data;if(j.data&&typeof j.data.content==='string')return j.data.content;if(j.data&&typeof j.data.html==='string')return j.data.html;}catch(e){}}return s;}

function validateParsed(p){if(!p.rows.length)throw new Error('サークル行を検出できませんでした'+(p.preview?`（応答先頭: ${p.preview}）` :''));if(p.meta.expectedCount&&p.rows.length!==p.meta.expectedCount)throw new Error(`公式記載 ${p.meta.expectedCount}件に対して ${p.rows.length}件を取得しました`);return p;}

async function fetchWithTimeout(url,ms=25000,options={}){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),ms);try{const r=await fetch(url,{cache:'no-store',signal:ctrl.signal,...options});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text();}finally{clearTimeout(timer);}}
async function fetchAndParseSource(sourceUrl){

    {label:'Reader 全文Markdown',url:'https://r.jina.ai/'+sourceUrl,options:{headers:{'X-Respond-With':'markdown','X-Retain-Links':'all','X-No-Cache':'true'}}},

async function syncOfficial(){

function renderEventUI(){const sel=document.getElementById('eventSelect');sel.innerHTML=events.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('');sel.value=currentEventId;document.querySelector('header h1').textContent='けもケット 個人カタログ';renderEventPage();}
function renderEventPage(){const el=document.getElementById('eventList');if(!el)return;el.innerHTML=events.map(e=>`<div class="event-item" data-event-id="${esc(e.id)}"><div style="min-width:0"><b>${esc(e.name)}</b>${e.id===currentEventId?' <span class="small">（使用中）</span>':''}<div class="event-meta">情報源 ${e.sources.length}件</div><textarea class="source-editor" data-event-sources="${esc(e.id)}" aria-label="${esc(e.name)}の情報源URL">${esc(e.sources.join('\n'))}</textarea></div><div class="event-actions"><button data-event-action="saveSources">URL保存</button><button data-event-action="rename">名前変更</button>${events.length>1?'<button class="warn" data-event-action="delete">削除</button>':''}</div></div>`).join('');}
function switchEvent(id){if(id===currentEventId)return;save();savePrefs();saveSync();resetDetailSessionToDefault();currentEventId=id;saveEvents();circles=[];prefs=defaultPrefs();syncInfo=null;try{circles=JSON.parse(localStorage.getItem(eventKey('circles'))||'[]').map(migrateCircle)}catch(e){circles=[]}try{prefs=normalizePrefs(JSON.parse(localStorage.getItem(eventKey('prefs'))||'{}'))}catch(e){}try{syncInfo=JSON.parse(localStorage.getItem(eventKey('sync'))||'null')}catch(e){}renderAll();}
function parseSourceTextarea(v){return uniq(String(v||'').split(/\r?\n/).map(x=>x.trim()).filter(x=>/^https?:\/\//i.test(x)));}
function addEvent(){const name=String(document.getElementById('newEventName').value||'').trim(),sources=parseSourceTextarea(document.getElementById('newEventSources').value);if(!name)return alert('イベント名を入力してください');if(!sources.length)return alert('サークルリストURLを1つ以上入力してください');let id=slugifyEvent(name),base=id,n=2;while(events.some(e=>e.id===id))id=base+'-'+n++;events.push({id,name,sources});saveEvents();document.getElementById('newEventName').value='';renderEventUI();switchEvent(id);showPage('catalog');}
function saveEventSources(id){const ev=events.find(e=>e.id===id),ta=document.querySelector(`textarea[data-event-sources="${CSS.escape(id)}"]`);if(!ev||!ta)return;const sources=parseSourceTextarea(ta.value);if(!sources.length)return alert('URLを1つ以上入力してください');ev.sources=sources;saveEvents();if(id===currentEventId)syncInfo=null;renderEventUI();renderSyncMeta();}
function renameEvent(id){const ev=events.find(e=>e.id===id);if(!ev)return;const name=String(prompt('イベント名',ev.name)||'').trim();if(!name)return;ev.name=name;saveEvents();renderEventUI();}
function deleteEvent(id){const ev=events.find(e=>e.id===id);if(!ev||events.length<=1)return;if(!confirm(`「${ev.name}」を削除しますか？\nこの端末に保存した当該イベントの一覧・メモ等も削除します。`))return;['circles','prefs','sync'].forEach(k=>localStorage.removeItem(`kemoket_event_${id}_${k}_v1`));events=events.filter(e=>e.id!==id);if(currentEventId===id){currentEventId=events[0].id;localStorage.setItem(LS_CURRENT_EVENT,currentEventId);circles=[];prefs=defaultPrefs();syncInfo=null;try{circles=JSON.parse(localStorage.getItem(eventKey('circles'))||'[]').map(migrateCircle)}catch(e){}try{prefs=normalizePrefs(JSON.parse(localStorage.getItem(eventKey('prefs'))||'{}'))}catch(e){}try{syncInfo=JSON.parse(localStorage.getItem(eventKey('sync'))||'null')}catch(e){}}saveEvents();renderAll();}

window.addEventListener('DOMContentLoaded',()=>{load();document.getElementById('eventSelect').addEventListener('change',e=>switchEvent(e.target.value));document.getElementById('manageEventsBtn').onclick=()=>{showPage('events');renderEventPage();};document.getElementById('backFromEventsBtn').onclick=()=>showPage('catalog');document.getElementById('addEventBtn').onclick=addEvent;document.getElementById('eventList').addEventListener('click',e=>{const item=e.target.closest('[data-event-id]');if(!item)return;const id=item.dataset.eventId;if(e.target.closest('[data-event-action="saveSources"]'))saveEventSources(id);if(e.target.closest('[data-event-action="rename"]'))renameEvent(id);if(e.target.closest('[data-event-action="delete"]'))deleteEvent(id);});bindPref('q','q','input');bindPref('colorFilter','color');bindPref('sort','sort');document.getElementById('detailDefaultOpen').addEventListener('change',e=>{prefs.detailDefaultOpen=e.target.checked;savePrefs();resetDetailSessionToDefault();renderAll();});document.getElementById('syncBtn').onclick=syncOfficial;document.getElementById('exportBtn').onclick=exportData;document.getElementById('importFile').onchange=e=>e.target.files[0]&&importData(e.target.files[0]);document.getElementById('clearBtn').onclick=()=>{if(confirm('色・購入予定・予算・メモ・訪問済みをすべて初期化しますか？')){circles.forEach(c=>c.state=stateTemplate());save();renderAll();}};document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const cardEl=e.target.closest('.card');if(!cardEl)return;const id=cardEl.dataset.id,act=b.dataset.action,val=b.dataset.value;if(act==='toggleDetails'){const c=circles.find(x=>x.id===id);if(!c)return;const key=detailSessionKey(c),open=!isDetailsOpen(c);detailSessionOverrides.set(key,open);const fields=cardEl.querySelector('.fields');if(fields)fields.classList.toggle('hidden',!open);b.setAttribute('aria-expanded',open?'true':'false');b.innerHTML=chevronSvg(open);return;}if(act==='color'){updateCircle(id,c=>c.state.color=val);renderAll();}});document.addEventListener('change',e=>{const cardEl=e.target.closest('.card');if(cardEl&&e.target.dataset.action==='visited'){updateCircle(cardEl.dataset.id,c=>c.state.visited=e.target.checked);renderAll();return;}if(cardEl&&e.target.dataset.field){const f=e.target.dataset.field;updateCircle(cardEl.dataset.id,c=>c.state[f]=e.target.value);}});document.addEventListener('input',e=>{const cardEl=e.target.closest('.card');if(cardEl&&e.target.dataset.field){const f=e.target.dataset.field;updateCircle(cardEl.dataset.id,c=>c.state[f]=e.target.value);}});renderAll();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});});</script></body></html>
