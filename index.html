.details-toggle-row{display:flex;justify-content:flex-end;align-items:center;height:36px;margin:4px 0 6px}.collapse-btn{width:42px;height:34px;padding:0;display:grid;place-items:center;border-radius:11px;background:#141b26;border:1px solid #2a3444;box-shadow:none;line-height:1}.collapse-btn svg{width:20px;height:20px;display:block;pointer-events:none;overflow:visible}.detail-hint{font-size:12px;color:var(--muted);margin:0 0 6px}.checkline{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#121721}.checkline input{width:18px;height:18px;margin-top:1px;flex:0 0 auto}.checktext b{display:block;margin-bottom:2px}.checktext span{font-size:12px;color:var(--muted);line-height:1.5}</style></head><body>
<header>
  <div class="header-row">
    <h1>けもケット 個人カタログ</h1>
  </div>
</header>
<main>
  <section id="catalogPage" class="page">
    <div class="eventbar">
      <select id="eventSelect" aria-label="イベント選択"></select>
      <button id="manageEventsBtn">イベント管理</button>
    </div>
    <div class="toolbar">
      <input id="q" class="wide" type="search" placeholder="サークル名・配置・代表者・メモを検索">
      <select id="colorFilter">
        <option value="all">色：全部</option><option value="red">赤</option><option value="orange">橙</option><option value="yellow">黄</option><option value="green">緑</option><option value="blue">青</option><option value="gray">灰</option>
      </select>
      <select id="sort">
        <option value="space">配置順</option><option value="name">サークル名順</option><option value="unvisited">未訪問優先</option>
      </select>
    </div>
    <div class="toolbar tight">
      <button class="primary" id="syncBtn">公式リスト同期</button>
      <button id="exportBtn">バックアップ保存</button>
      <label><button type="button" onclick="this.parentElement.querySelector('input').click()">バックアップ読込</button><input id="importFile" type="file" accept="application/json" hidden></label>
      <button class="warn" id="clearBtn">チェックを全初期化</button>
    </div>
    <div id="syncMeta" class="sync-meta"></div>
    <div class="stats" id="stats"></div>
    <section id="list"></section>
    <div class="footer-help">公式リスト同期では、<b>配置 / サークル名 / 代表者名 / web / pixiv / tw</b> を取り込みます。リンクなしは灰色の🚫表示です。　<span class="small">app v12R</span></div>
  </section>

  <section id="eventPage" class="page hidden">
    <div class="panel">
      <div class="kv"><h2 style="margin:0">イベント管理</h2><button id="backFromEventsBtn">← 戻る</button></div>
      <p class="note">けもケット専用版です。今後のけもケットをここへ追加できます。イベントごとにサークル一覧・色・購入予定・予算・メモ・訪問済み・表示設定を別々に保存します。</p>
      <label class="checkline"><input id="detailDefaultOpen" type="checkbox"><span class="checktext"><b>購入予定品・予算・メモを初期状態で展開する</b><span>オフの場合は折りたたみ状態で起動します。個別の開閉はその起動中だけ有効で、次回起動時はこの設定に戻ります。</span></span></label>
      <div class="toolbar" style="margin-top:10px">
        <input id="newEventName" placeholder="イベント名（例：けもケット18）">
        <input id="newEventUrl" class="wide" value="https://skypalette.jp/kemoket/list.html" placeholder="公式サークルリストURL">
        <button class="good" id="addEventBtn">イベント追加</button>
      </div>
      <div id="eventList"></div>
    </div>
  </section>
</main>
<script>const VERSION='2026-08-24-12R';
const LS_EVENTS='kemoket_events_v1';
const LS_CURRENT_EVENT='kemoket_current_event_v1';
const OBSOLETE_TAG_KEYS=['kemoket_tag_defs_v2','kemoket_shared_tags_v1'];
const DEFAULT_EVENTS=[{id:'kemoket17',name:'けもケット17',officialUrl:'https://skypalette.jp/kemoket/list.html'}];
const stateTemplate=()=>({color:'gray',item:'',budget:'',memo:'',visited:false,updatedAt:0});
const defaultPrefs=()=>({q:'',color:'all',sort:'space',detailDefaultOpen:false});
let circles=[];
let prefs=defaultPrefs();
let syncInfo=null;
let events=[];
let currentEventId='kemoket17';
// 個別の開閉状態はこの起動中だけ保持する。再起動時には起動時設定へ戻す。
let detailSessionOverrides=new Map();
function eventKey(kind){return `kemoket_event_${currentEventId}_${kind}_v1`;}
// v13-v15の汎用イベント形式(sources[])から、v12の単一公式URL形式へ安全に戻す。
// データは削除せず、先頭URLのみを officialUrl として引き継ぐ。
function normalizeRollbackEvent(e){
  e=e&&typeof e==='object'?e:{};
  const url=String(e.officialUrl||((Array.isArray(e.sources)&&e.sources[0])||'')).trim();
  return {id:String(e.id||slugifyEvent(e.name||'event')),name:String(e.name||'イベント'),officialUrl:url};
}
function isKemoketOfficialEvent(e){let host='';try{host=new URL(e?.officialUrl||'').hostname}catch(_){}return /(?:^|\.)skypalette\.jp$/i.test(host)&&/kemoket/i.test(e?.officialUrl||'');}
function currentEvent(){return events.find(e=>e.id===currentEventId)||events[0];}
function slugifyEvent(name){const base=String(name||'event').toLowerCase().replace(/けもケット/g,'kemoket').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');return base||('event-'+Date.now());}
function saveEvents(){localStorage.setItem(LS_EVENTS,JSON.stringify(events));localStorage.setItem(LS_CURRENT_EVENT,currentEventId);}
function save(){localStorage.setItem(eventKey('circles'), JSON.stringify(circles));}
function savePrefs(){localStorage.setItem(eventKey('prefs'), JSON.stringify(prefs));}
function saveSync(){localStorage.setItem(eventKey('sync'), JSON.stringify(syncInfo));}
function normalizeState(st){
  const clean={...stateTemplate(),...(st||{})};
  delete clean.priority;
  delete clean.tags; delete clean.tagMeta; delete clean.tagCandidates;
  delete clean.detailsOpen;
  return clean;
}
function normalizePrefs(raw){
  raw=raw&&typeof raw==='object'?raw:{};
  return {q:String(raw.q||''),color:['all','red','orange','yellow','green','blue','gray'].includes(raw.color)?raw.color:'all',sort:['space','name','unvisited'].includes(raw.sort)?raw.sort:'space',detailDefaultOpen:!!raw.detailDefaultOpen};
}
function removeObsoleteTagStorage(){
  for(const key of OBSOLETE_TAG_KEYS)localStorage.removeItem(key);
  // v8以前のタグ情報を、全イベントの保存データから完全に取り除く。
  for(const ev of events){
    const ckey=`kemoket_event_${ev.id}_circles_v1`;
    try{const arr=JSON.parse(localStorage.getItem(ckey)||'[]');if(Array.isArray(arr)){for(const c of arr)c.state=normalizeState(c.state);localStorage.setItem(ckey,JSON.stringify(arr));}}catch(e){}
    const pkey=`kemoket_event_${ev.id}_prefs_v1`;
    try{localStorage.setItem(pkey,JSON.stringify(normalizePrefs(JSON.parse(localStorage.getItem(pkey)||'{}'))));}catch(e){}
  }
}
function migrateK17(){
  if(currentEventId!=='kemoket17')return;
  const maps=[['kemoket17_circles_v2','circles'],['kemoket17_prefs_v2','prefs'],['kemoket17_sync_v1','sync']];
  for(const [oldKey,kind] of maps){const nk=eventKey(kind);if(!localStorage.getItem(nk)&&localStorage.getItem(oldKey))localStorage.setItem(nk,localStorage.getItem(oldKey));}
}
function load(){
  try{events=JSON.parse(localStorage.getItem(LS_EVENTS)||'[]')}catch(e){events=[]}
  if(!Array.isArray(events)||!events.length)events=[...DEFAULT_EVENTS];
  events=events.map(normalizeRollbackEvent);
  // 汎用版で非けもケットイベントを選んだまま戻しても、起動直後はけもケットへ復帰する。
  // 他イベントの保存データ自体は削除しない。
  let savedCurrent=localStorage.getItem(LS_CURRENT_EVENT)||events[0].id;
  if(!events.some(e=>e.id===savedCurrent))savedCurrent=events[0].id;
  const savedEvent=events.find(e=>e.id===savedCurrent);
  if(savedEvent&&!isKemoketOfficialEvent(savedEvent)){
    const k17=events.find(e=>e.id==='kemoket17')||events.find(isKemoketOfficialEvent);
    if(k17)savedCurrent=k17.id;
  }
  currentEventId=savedCurrent;
  migrateK17();removeObsoleteTagStorage();
  try{circles=JSON.parse(localStorage.getItem(eventKey('circles'))||'[]')}catch(e){circles=[]}
  prefs=defaultPrefs();try{prefs=normalizePrefs(JSON.parse(localStorage.getItem(eventKey('prefs'))||'{}'))}catch(e){}
  try{syncInfo=JSON.parse(localStorage.getItem(eventKey('sync'))||'null')}catch(e){syncInfo=null}
  // v13-v15の汎用同期結果はv12の表示形式と互換性がないため、同期表示だけ未同期へ戻す。
  // サークル一覧と個人チェックは残し、次回のけもケット同期で正規化する。
  if(syncInfo&&(!Number.isFinite(Number(syncInfo.expectedCount))||!syncInfo.links))syncInfo=null;
  if(!Array.isArray(circles))circles=[];
  circles.forEach(c=>{if(!c.tw&&c.x)c.tw=c.x;c.state=normalizeState(c.state);});
  save();saveEvents();savePrefs();saveSync();
}
function cleanText(s=''){return String(s).replace(/\*\*/g,'').replace(/<[^>]+>/g,'').replace(/&nbsp;/gi,' ').replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/\s+/g,' ').trim();}
function cleanMd(s=''){return cleanText(String(s).replace(/\[([^\]]+)\]\(([^)]+)\)/g,'$1').replace(/\\\|/g,'|'));}
function getOfficialUrl(){return currentEvent()?.officialUrl||'';}
function isOfficialPlaceholderUrl(url=''){
  try{
    const officialRaw=getOfficialUrl();
    if(!officialRaw)return false;
    const target=new URL(url,officialRaw);
    const official=new URL(officialRaw,location.href);
    const normPath=p=>(p||'/').replace(/\/+$/,'')||'/';
    // 公式表の「リンクなし」は href="#"。Readerがこれを list.html 自身の
    // 絶対URLへ展開するため、同じ公式リストページを指すURLはリンクなし扱いにする。
    return target.origin===official.origin && normPath(target.pathname)===normPath(official.pathname);
  }catch(e){return false;}
}
function normalizeUrl(u='',kind=''){
  u=String(u||'').trim().replace(/^['\"]|['\"]$/g,'').replace(/&amp;/g,'&');
  if(!u || u==='#' || u==='-' || u==='—' || u==='–' || u==='　' || /^javascript:/i.test(u)) return '';
  if(u.startsWith('//')) u='https:'+u;
  if(/^www\./i.test(u)) u='https://'+u;
  if(!/^https?:\/\//i.test(u) && /^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u)) u='https://'+u;
  let absolute='';
  try{absolute=new URL(u,getOfficialUrl()||location.href).href;}catch(e){return '';}
  if(!/^https?:\/\//i.test(absolute) || isOfficialPlaceholderUrl(absolute)) return '';
  try{
    const host=new URL(absolute).hostname.toLowerCase();
    // pixiv / tw は列の意味に合うドメインだけを採用し、Reader由来の誤リンクを防ぐ。
    if(kind==='pixiv' && !(host==='pixiv.net'||host.endsWith('.pixiv.net'))) return '';
    if(kind==='tw' && !(host==='x.com'||host.endsWith('.x.com')||host==='twitter.com'||host.endsWith('.twitter.com'))) return '';
  }catch(e){return '';}
  return absolute;
}
function extractUrl(cell='',kind=''){
  const text=String(cell||'').trim();
  if(!text) return '';
  const candidates=[...text.matchAll(/\[[^\]]*\]\(([^)\s]+)(?:\s+[^)]*)?\)/g)].map(m=>m[1]);
  for(const candidate of candidates){const url=normalizeUrl(candidate,kind);if(url)return url;}
  const plain=text.match(/(https?:\/\/[^\s|>\]）]+)/i) || text.match(/\b(www\.[^\s|>\]）]+)/i);
  return normalizeUrl(plain?plain[1]:'',kind);
}
function parseMeta(text=''){
  const src=String(text);
  const countMatch=src.match(/参加サークル\s*[：:]\s*([0-9０-９,，]+)\s*サークル/);
  const dateMatch=src.match(/\(?([0-9]{4}\/[0-9]{1,2}\/[0-9]{1,2})\s*更新\)?/);
  const fullToHalf=s=>String(s||'').replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/[，,]/g,'');
  return {expectedCount:countMatch?Number(fullToHalf(countMatch[1])):null,officialUpdated:dateMatch?dateMatch[1]:''};
}
function makeRow(space,name,rep,web,pixiv,tw){
  const s=cleanMd(space),n=cleanMd(name),r=cleanMd(rep);
  if(!/^[A-Z]-\d{2,3}$/.test(s)||!n) return null;
  return {id:s+'::'+n,space:s,name:n,rep:r,web:extractUrl(web,'web'),pixiv:extractUrl(pixiv,'pixiv'),tw:extractUrl(tw,'tw'),state:stateTemplate()};
}
function parseOfficialMarkdown(md){
  const text=String(md||'').replace(/\r/g,'');
  const rows=[]; const seen=new Set();
  const add=row=>{if(row&&!seen.has(row.id)){seen.add(row.id);rows.push(row);}};
  for(let raw of text.split('\n')){
    let line=raw.trim().replace(/^L\d+\s*:\s*/,'');
    if(line.startsWith('|')) line=line.slice(1).trim();
    if(line.endsWith('|')) line=line.slice(0,-1).trim();
    if(/^[A-Z]-\d{2,3}\s*\|/.test(line)){
      const cells=line.split('|').map(x=>x.trim());
      if(cells.length>=6) add(makeRow(cells[0],cells[1],cells[2],cells[3],cells[4],cells.slice(5).join('|')));
      continue;
    }
    if(/^[A-Z]-\d{2,3}\s*\t/.test(line)){
      const cells=line.split(/\t+/).map(x=>x.trim());
      if(cells.length>=6) add(makeRow(cells[0],cells[1],cells[2],cells[3],cells[4],cells.slice(5).join('\t')));
      continue;
    }
    if(/^[A-Z]-\d{2,3}\s{2,}/.test(line)){
      const cells=line.split(/\s{2,}/).map(x=>x.trim());
      if(cells.length>=6) add(makeRow(cells[0],cells[1],cells[2],cells[3],cells[4],cells.slice(5).join('  ')));
    }
  }
  if(rows.length<600){
    const re=/(?:^|\n)\s*(?:L\d+\s*:\s*)?\|?\s*([A-Z]-\d{2,3})\s*\|\s*([^|\n]+)\|\s*([^|\n]+)\|\s*([^|\n]*)\|\s*([^|\n]*)\|\s*([^\n|]*)(?:\|)?/g;
    let m; while((m=re.exec(text))!==null) add(makeRow(m[1],m[2],m[3],m[4],m[5],m[6]));
  }
  return {rows,meta:parseMeta(text),format:'markdown',preview:text.slice(0,180).replace(/\s+/g,' ')};
}
function parseOfficialHTML(html){
  const doc=new DOMParser().parseFromString(String(html),'text/html');
  const rows=[]; const seen=new Set();
  for(const tr of [...doc.querySelectorAll('tr')]){
    const cells=[...tr.querySelectorAll('td,th')];
    if(cells.length<6) continue;
    const space=cleanText(cells[0].textContent),name=cleanText(cells[1].textContent),rep=cleanText(cells[2].textContent);
    if(!/^[A-Z]-\d{2,3}$/.test(space)||!name) continue;
    const urlAt=(i,kind)=>{
      const anchors=[...cells[i].querySelectorAll('a[href]')];
      for(const a of anchors){const u=normalizeUrl(a.getAttribute('href')||'',kind);if(u)return u;}
      return '';
    };
    const row={id:space+'::'+name,space,name,rep,web:urlAt(3,'web'),pixiv:urlAt(4,'pixiv'),tw:urlAt(5,'tw'),state:stateTemplate()};
    if(!seen.has(row.id)){seen.add(row.id);rows.push(row);}
  }
  return {rows,meta:parseMeta(doc.body?.innerText||html),format:'html'};
}
function unwrapPayload(text){
  const s=String(text||'').trim();
  if(s.startsWith('{')||s.startsWith('[')){
    try{
      const j=JSON.parse(s);
      if(typeof j.contents==='string') return j.contents;
      if(typeof j.body==='string') return j.body;
      if(typeof j.content==='string') return j.content;
      if(typeof j.data==='string') return j.data;
