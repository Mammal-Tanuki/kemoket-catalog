<header>
  <div class="header-row">
    <h1>けもケット 個人カタログ</h1>
  </div>
</header>
<main>
  <section id="catalogPage" class="page">

      </select>
      <select id="sort">

    <div class="toolbar tight">
      <button class="primary" id="syncBtn">公式リスト同期</button>
      <button id="exportBtn">バックアップ保存</button>
      <label><button type="button" onclick="this.parentElement.querySelector('input').click()">バックアップ読込</button><input id="importFile" type="file" accept="application/json" hidden></label>
      <button class="warn" id="clearBtn">チェックを全初期化</button>
      <button class="warn debug-action fullrow hidden" id="resetSyncBtn">同期内容を削除</button>
    </div>
    <div id="syncMeta" class="sync-meta"></div>
    <div class="stats" id="stats"></div>
    <section id="list"></section>
    <div class="footer-help">公式リスト同期では、イベントごとの形式を解析し、<b>配置 / サークル名 / 作家・代表 / 公式属性 / 各種リンク</b>を共通形式へ変換します。　<span class="small">app v15</span></div>
  </section>

  <section id="eventPage" class="page hidden">
    <div class="panel">
      <div class="kv"><h2 style="margin:0">イベント管理</h2><button id="backFromEventsBtn">← 戻る</button></div>
      <p class="note">イベントごとに1つ以上のサークルリストURLを登録できます。同じイベントの「テキスト一覧」「サークルカット一覧」などは、URLを改行して複数登録すると同期時に統合します。</p>
      <label class="checkline"><input id="detailDefaultOpen" type="checkbox"><span class="checktext"><b>購入予定品・予算・メモを初期状態で展開する</b><span>オフの場合は折りたたみ状態で起動します。個別の開閉はその起動中だけ有効で、次回起動時はこの設定に戻ります。</span></span></label>
      <label class="checkline"><input id="showSyncResetButton" type="checkbox"><span class="checktext"><b>デバッグ用「同期内容を削除」ボタンを表示する</b><span>同期で取得したサークル一覧と同期結果だけを消せるボタンです。色・購入予定品・予算・メモ・訪問済みは退避して、同じサークルを再同期したときに復元します。</span></span></label>
      <div class="toolbar" style="margin-top:10px">
        <input id="newEventName" placeholder="イベント名（例：けもケット18）">
        <textarea id="newEventSources" class="wide" placeholder="サークルリストURL（複数ある場合は1行に1URL）">https://skypalette.jp/kemoket/list.html</textarea>
        <button class="good" id="addEventBtn">イベント追加</button>
      </div>
      <div id="eventList"></div>
    </div>
  </section>
</main>
<script>const VERSION='2026-08-24-15';
const LS_EVENTS='kemoket_events_v1';
const LS_CURRENT_EVENT='kemoket_current_event_v1';
const LS_APP_PREFS='kemoket_app_prefs_v1';
const OBSOLETE_TAG_KEYS=['kemoket_tag_defs_v2','kemoket_shared_tags_v1'];
const DEFAULT_EVENTS=[{id:'kemoket17',name:'けもケット17',sources:['https://skypalette.jp/kemoket/list.html']}];
const stateTemplate=()=>({color:'gray',item:'',budget:'',memo:'',visited:false,updatedAt:0});
const defaultPrefs=()=>({q:'',color:'all',sort:'space',detailDefaultOpen:false});
const defaultAppPrefs=()=>({showSyncResetButton:false});
let circles=[];
let prefs=defaultPrefs();
let appPrefs=defaultAppPrefs();
let syncInfo=null;
let syncInProgress=false;
let syncGeneration=0;
let events=[];
let currentEventId='kemoket17';
let detailSessionOverrides=new Map();
let activeSourceUrl='';

function eventKey(kind){return `kemoket_event_${currentEventId}_${kind}_v1`;}
function uniq(a){return [...new Set((a||[]).filter(Boolean))];}
function normalizeEvent(ev){
  const e={...ev};
  let sources=Array.isArray(e.sources)?e.sources:[];
  if(!sources.length&&e.officialUrl)sources=[e.officialUrl];
  e.sources=uniq(sources.map(x=>String(x||'').trim()).filter(x=>/^https?:\/\//i.test(x)));
  delete e.officialUrl;
  return e;
}
function currentEvent(){return events.find(e=>e.id===currentEventId)||events[0];}
function getSources(){return currentEvent()?.sources||[];}
function getOfficialUrl(){return activeSourceUrl||getSources()[0]||'';}
function slugifyEvent(name){const base=String(name||'event').toLowerCase().normalize('NFKC').replace(/けもケット/g,'kemoket').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');return base||('event-'+Date.now());}
function saveEvents(){localStorage.setItem(LS_EVENTS,JSON.stringify(events));localStorage.setItem(LS_CURRENT_EVENT,currentEventId);}
function save(){localStorage.setItem(eventKey('circles'),JSON.stringify(circles));}
function savePrefs(){localStorage.setItem(eventKey('prefs'),JSON.stringify(prefs));}
function saveSync(){localStorage.setItem(eventKey('sync'),JSON.stringify(syncInfo));}
function normalizeAppPrefs(raw){raw=raw&&typeof raw==='object'?raw:{};return {showSyncResetButton:!!raw.showSyncResetButton};}
function saveAppPrefs(){localStorage.setItem(LS_APP_PREFS,JSON.stringify(appPrefs));}
function loadStateCache(){try{const a=JSON.parse(localStorage.getItem(eventKey('statecache'))||'[]');return Array.isArray(a)?a.map(x=>({space:normalizeSpace(x.space||''),name:cleanMd(x.name||''),links:normalizeLinks(x.links||[]),state:normalizeState(x.state)})).filter(x=>x.name):[];}catch(e){return[];}}
function saveStateCache(a){localStorage.setItem(eventKey('statecache'),JSON.stringify((a||[]).map(x=>({space:x.space||'',name:x.name||'',links:x.links||[],state:normalizeState(x.state)}))));}
function persistStateCacheFromCircles(){const map=new Map(loadStateCache().map(x=>[circleKey(x),x]));for(const c of circles){map.set(circleKey(c),{space:c.space,name:c.name,links:c.links||[],state:normalizeState(c.state)});}saveStateCache([...map.values()]);}
function normalizeState(st){const clean={...stateTemplate(),...(st||{})};delete clean.priority;delete clean.tags;delete clean.tagMeta;delete clean.tagCandidates;delete clean.detailsOpen;return clean;}
function normalizePrefs(raw){raw=raw&&typeof raw==='object'?raw:{};return {q:String(raw.q||''),color:['all','red','orange','yellow','green','blue','gray'].includes(raw.color)?raw.color:'all',sort:['space','name','unvisited'].includes(raw.sort)?raw.sort:'space',detailDefaultOpen:!!raw.detailDefaultOpen};}
function migrateCircle(c){
  const out={...c};
  out.space=normalizeSpace(out.space||'');out.name=cleanMd(out.name||'');out.rep=cleanMd(out.rep||'');out.description=cleanMd(out.description||'');out.cutImage=normalizeUrl(out.cutImage||'');
  out.attributes=uniq(Array.isArray(out.attributes)?out.attributes.map(cleanMd):[]);
  out.links=normalizeLinks(out.links||[]);
  if(out.web)out.links=mergeLinks(out.links,[makeLink(out.web,'web')]);
  if(out.pixiv)out.links=mergeLinks(out.links,[makeLink(out.pixiv,'pixiv')]);
  if(out.tw||out.x)out.links=mergeLinks(out.links,[makeLink(out.tw||out.x,'x')]);
  out.linkCapabilities=uniq(Array.isArray(out.linkCapabilities)?out.linkCapabilities:((out.web!==undefined||out.pixiv!==undefined||out.tw!==undefined)?['web','pixiv','x']:[]));
  delete out.web;delete out.pixiv;delete out.tw;delete out.x;
  out.sourceUrls=uniq(Array.isArray(out.sourceUrls)?out.sourceUrls:[]);
  out.state=normalizeState(out.state);
  out.id=circleKey(out);
  return out;
}
function removeObsoleteStorage(){for(const key of OBSOLETE_TAG_KEYS)localStorage.removeItem(key);for(const ev of events){const ckey=`kemoket_event_${ev.id}_circles_v1`;try{const arr=JSON.parse(localStorage.getItem(ckey)||'[]');if(Array.isArray(arr))localStorage.setItem(ckey,JSON.stringify(arr.map(migrateCircle)));}catch(e){}const pkey=`kemoket_event_${ev.id}_prefs_v1`;try{localStorage.setItem(pkey,JSON.stringify(normalizePrefs(JSON.parse(localStorage.getItem(pkey)||'{}'))));}catch(e){}}}
function migrateK17(){if(currentEventId!=='kemoket17')return;const maps=[['kemoket17_circles_v2','circles'],['kemoket17_prefs_v2','prefs'],['kemoket17_sync_v1','sync']];for(const [oldKey,kind] of maps){const nk=eventKey(kind);if(!localStorage.getItem(nk)&&localStorage.getItem(oldKey))localStorage.setItem(nk,localStorage.getItem(oldKey));}}
function load(){
  try{events=JSON.parse(localStorage.getItem(LS_EVENTS)||'[]')}catch(e){events=[]}
  if(!Array.isArray(events)||!events.length)events=[...DEFAULT_EVENTS];events=events.map(normalizeEvent);if(!events[0].sources.length)events[0]=DEFAULT_EVENTS[0];
  currentEventId=localStorage.getItem(LS_CURRENT_EVENT)||events[0].id;if(!events.some(e=>e.id===currentEventId))currentEventId=events[0].id;
  migrateK17();removeObsoleteStorage();
  try{circles=JSON.parse(localStorage.getItem(eventKey('circles'))||'[]')}catch(e){circles=[]}
  if(!Array.isArray(circles))circles=[];circles=circles.map(migrateCircle);
  try{prefs=normalizePrefs(JSON.parse(localStorage.getItem(eventKey('prefs'))||'{}'))}catch(e){prefs=defaultPrefs()}
  try{syncInfo=JSON.parse(localStorage.getItem(eventKey('sync'))||'null')}catch(e){syncInfo=null}
  try{appPrefs=normalizeAppPrefs(JSON.parse(localStorage.getItem(LS_APP_PREFS)||'{}'))}catch(e){appPrefs=defaultAppPrefs()}
  save();saveEvents();savePrefs();saveAppPrefs();
}
function cleanText(s=''){return String(s).replace(/\*\*/g,'').replace(/<[^>]+>/g,'').replace(/&nbsp;/gi,' ').replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/\s+/g,' ').trim();}
function cleanMd(s=''){return cleanText(String(s).replace(/!\[[^\]]*\]\((?:[^()]|\([^)]*\))*\)/g,'').replace(/\[([^\]]*)\]\((?:https?:\/\/)?[^)]+\)/g,'$1').replace(/^\s{0,3}#{1,6}\s*/,'').replace(/^\s*[-*+]\s+/,'').replace(/\\\|/g,'|'));}
function normalizeSpace(s=''){return cleanText(s).normalize('NFKC').replace(/[ \t　]+/g,'').replace(/[，]/g,',');}
function looksLikeSpace(s=''){
  const x=normalizeSpace(s);
  if(/^(?:企業|本部)$/.test(x))return true;
  const latin='[A-Z]';
  const kana='[ぁ-んァ-ヶ一-龯]';
  return new RegExp('^(?:'+
    latin+'-?\\d{1,3}(?:[ab])?(?:-'+latin+'?\\d{1,3}(?:[ab])?)?'+
    '|'+latin+'-?\\d{1,3}(?:[ab])?(?:,(?:'+latin+'-?)?\\d{1,3}(?:[ab])?)+'+
    '|'+kana+'\\d{1,3}[ab]?'+
    '|企\\d{1,3})$','i').test(x);
}
function isImageUrl(url=''){try{const u=new URL(normalizeUrl(url)||url,getOfficialUrl()||location.href);return /\.(?:png|jpe?g|webp|gif|avif|svg)(?:$|[?#])/i.test(u.pathname+u.search+u.hash)||/\/storage\/v1\/object\/public\/[^?#]+\.(?:png|jpe?g|webp|gif|avif)/i.test(u.href);}catch(e){return /\.(?:png|jpe?g|webp|gif|avif|svg)(?:$|[?#])/i.test(String(url));}}
function extractImageUrls(text=''){const out=[];const src=String(text||'');for(const m of src.matchAll(/!\[[^\]]*\]\((https?:\/\/[^)\s]+)(?:\s+[^)]*)?\)/g)){const u=normalizeUrl(m[1]);if(u)out.push(u);}for(const m of src.matchAll(/https?:\/\/[^\s|>\]）)]+/gi)){const u=normalizeUrl(m[0]);if(u&&isImageUrl(u))out.push(u);}return uniq(out);}
function isImagePlaceholder(text=''){const s=cleanText(text);return /^!?\s*(?:image|画像)\s*\d*$/i.test(s)||/^!?\s*\[?(?:image|画像)[^\]]*\]?$/i.test(s);}
function naturalParts(s=''){return normalizeSpace(s).normalize('NFKC').match(/\d+|\D+/g)||[''];}
function compareSpace(a,b){const x=naturalParts(a),y=naturalParts(b),n=Math.max(x.length,y.length);for(let i=0;i<n;i++){if(x[i]===undefined)return-1;if(y[i]===undefined)return 1;const xn=/^\d+$/.test(x[i]),yn=/^\d+$/.test(y[i]);if(xn&&yn){const d=Number(x[i])-Number(y[i]);if(d)return d;}else{const d=String(x[i]).localeCompare(String(y[i]),'ja',{numeric:true,sensitivity:'base'});if(d)return d;}}return 0;}
function circleKey(c){return `${normalizeSpace(c.space||'')}::${cleanText(c.name||'').normalize('NFKC').toLowerCase()}`;}
function isPlaceholderUrl(url=''){
  try{const base=getOfficialUrl();if(!base)return false;const a=new URL(url,base),b=new URL(base,location.href);const p=x=>(x||'/').replace(/\/+$/,'')||'/';return a.origin===b.origin&&p(a.pathname)===p(b.pathname)&&(a.hash===''||a.hash==='#');}catch(e){return false;}
}
function normalizeUrl(u=''){
  u=String(u||'').trim().replace(/^['"]|['"]$/g,'').replace(/%22$/i,'').replace(/&amp;/g,'&');
  if(!u||u==='#'||u==='-'||u==='—'||u==='–'||u==='　'||/^javascript:/i.test(u))return'';
  if(u.startsWith('//'))u='https:'+u;if(/^www\./i.test(u))u='https://'+u;if(!/^https?:\/\//i.test(u)&&/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u))u='https://'+u;
  try{const out=new URL(u,getOfficialUrl()||location.href).href;return /^https?:\/\//i.test(out)&&!isPlaceholderUrl(out)?out:'';}catch(e){return'';}
}
function classifyLink(url,labelHint=''){
  const hint=cleanText(labelHint).toLowerCase();let host='';try{host=new URL(url).hostname.toLowerCase()}catch(e){}
  if(/参加.?pr|pr投稿|event.?pr/.test(hint))return'pr';
  if(host==='x.com'||host.endsWith('.x.com')||host==='twitter.com'||host.endsWith('.twitter.com'))return'x';
  if(host==='pixiv.net'||host.endsWith('.pixiv.net'))return'pixiv';
  if(host==='instagram.com'||host.endsWith('.instagram.com'))return'instagram';
  if(host==='bsky.app'||host.endsWith('.bsky.app'))return'bsky';

function spaceKey(s){return normalizeSpace(s);}
